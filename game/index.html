<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Twin Lanterns — Spot the Difference</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e1830; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #fff; }
  header {
    height: 80px; display: flex; align-items: center; gap: 10px;
    padding: 0 12px; background: #16223e; border-bottom: 2px solid #ffd93b;
  }
  .brand { font-size: 18px; font-weight: 700; white-space: nowrap; }
  .brand span { color: #ffd93b; }
  .tabs { display: flex; gap: 6px; }
  .tabs button {
    background: #24365e; color: #dfe8ff; border: 1px solid #3a4f7d;
    border-radius: 8px; padding: 7px 10px; font-size: 13px; cursor: pointer;
  }
  .tabs button.active { background: #ffd93b; color: #1b2a4a; border-color: #ffd93b; font-weight: 700; }
  .level-name { font-size: 14px; color: #bcd0ff; white-space: nowrap; min-width: 120px; }
  .timer { display: flex; flex-direction: column; gap: 4px; min-width: 130px; }
  .timer-row { display: flex; justify-content: space-between; font-size: 13px; color: #bcd0ff; }
  #timerText { font-weight: 700; color: #fff; font-variant-numeric: tabular-nums; }
  #timerText.low { color: #ff6b6b; }
  .timer-track { height: 8px; background: #24365e; border-radius: 4px; overflow: hidden; }
  #timerBar { height: 100%; width: 100%; background: #2ecc40; border-radius: 4px; transition: width .2s linear; }
  #timerBar.low { background: #ff4136; }
  #counter { font-size: 14px; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
  #score { font-size: 14px; font-weight: 700; color: #ffd93b; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .actions { margin-left: auto; display: flex; gap: 6px; }
  .actions button {
    background: #ffd93b; color: #1b2a4a; border: none; border-radius: 8px;
    padding: 8px 10px; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap;
  }
  .actions button:disabled { background: #3a4f7d; color: #8fa3cc; cursor: default; }
  .actions button.ghost { background: #24365e; color: #dfe8ff; border: 1px solid #3a4f7d; }
  #game { display: block; width: 100vw; height: calc(100vh - 80px); touch-action: none; cursor: crosshair; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<header>
  <div class="brand">Twin Lanterns</div>
  <nav class="tabs" aria-label="Levels">
    <button data-level="0" class="active">1 Garden</button>
    <button data-level="1">2 Harbor</button>
    <button data-level="2">3 Library</button>
  </nav>
  <div class="level-name" id="levelName">Level 1 — Sunny Garden</div>
  <div class="timer">
    <div class="timer-row"><span>Time left</span><span id="timerText">2:30</span></div>
    <div class="timer-track"><div id="timerBar"></div></div>
  </div>
  <div id="counter">Find every difference</div>
  <div id="score">Score 0</div>
  <div class="actions">
    <button id="hintBtn" type="button">Hint (3)</button>
    <button id="soundBtn" type="button" class="ghost">Sound on</button>
    <button id="restartBtn" type="button" class="ghost">Restart</button>
  </div>
</header>
<canvas id="game" width="1280" height="640" aria-label="Twin Lanterns spot the difference: two near-identical pictures side by side, click the differences"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
